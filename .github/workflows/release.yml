name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Java 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: 25
        distribution: temurin

    - name: Build bundle
      run: ./gradlew --no-parallel --no-daemon --build-cache build

    - name: Verify dist/ at this tag is fresh
      run: |
        cp cache-action-entrypoint/build/dist/js/productionExecutable/cache-action-entrypoint.js dist/
        cp cache-action-entrypoint/build/dist/js/productionExecutable/cache-action-entrypoint.js.LICENSE.txt dist/
        if [ -n "$(git status --porcelain dist)" ]; then
          echo "::error::dist/ at this tag is stale. Rebuild (./release.sh), commit, and re-tag."
          git diff --stat -- dist
          echo "::group::Diff between the committed bundle and a fresh build"
          git diff --word-diff=porcelain --unified=0 -- dist | head -200
          echo "::endgroup::"
          exit 1
        fi
        echo "dist/ matches a fresh build."

    - name: Create release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3

    - name: Update major tag
      uses: cssnr/update-version-tags-action@dc7077eaec04b8fd61f7b7e6d4830564cfd12382 # v2
      with:
        minor: false
